<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>Tjeneste | Sørgulen Industriservice</title>
  <meta name="description" content="Se pris og informasjon om tjenester fra Sørgulen Industriservice i Florø.">
  <link rel="stylesheet" href="../style.css">
  <style>
    .ai-detail-wrap{max-width:1180px;margin:0 auto;padding:44px 18px 70px}.ai-detail-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:start}.ai-detail-image{width:100%;max-height:620px;object-fit:contain;background:#fff;border-radius:26px;border:1px solid rgba(255,255,255,.12)}.ai-detail-panel{position:sticky;top:86px;padding:26px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.12)}.ai-detail-panel h1{font-size:clamp(2rem,4vw,3.7rem);line-height:1.04;margin:10px 0 12px}.ai-detail-panel p,.ai-detail-description{color:#c6d3e4;line-height:1.65}.ai-detail-description{white-space:pre-wrap;margin:16px 0}.ai-detail-price{font-size:1.45rem;font-weight:900;color:#38d996;margin:18px 0}.ai-content-badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#38d996;color:#06110c;font-weight:900;font-size:.8rem}.ai-detail-section{margin-top:18px;padding:22px;border-radius:22px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}.ai-detail-section h2{margin-top:0}.ai-detail-section li{margin:8px 0;color:#d3dfed}.ai-detail-specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ai-detail-specs>div{padding:13px;border-radius:14px;background:rgba(255,255,255,.05)}.ai-detail-specs small{display:block;color:#8fa2b9}.ai-detail-specs strong{display:block;margin-top:4px}.ai-detail-section details{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}.ai-detail-section summary{cursor:pointer;font-weight:800}.ai-detail-section details p{color:#b8c8da}.ai-detail-loading{padding:50px 0;color:#9eb0c4}@media(max-width:900px){.ai-detail-grid{grid-template-columns:1fr}.ai-detail-panel{position:static}.ai-detail-specs{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a href="../index.html" class="logo"><img src="../assets/logo.png" alt="Sørgulen logo" width="34" height="34"><b>Sørgulen&nbsp;Industriservice</b></a>

    </div>
    <div class="menu-panel" id="menuPanel"><a href="../index.html">Hjem</a><a href="../index.html#tjenester">Tjenester</a><a href="../prisestimat.html">Få prisestimat</a><a href="../kontakt.html">Kontakt</a></div>
  </header>
  <main id="aiServiceDetail" class="ai-detail-wrap"><div class="ai-detail-loading">Laster tjeneste…</div></main>
  <script src="../app.js" defer></script>
</body>
</html>
