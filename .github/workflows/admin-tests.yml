name: Admin frontend-tester

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4
      - name: Bruk Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kontroller JavaScript-syntaks
        run: |
          node --check admin/admin-shell.js
          node --check admin/operations-ui.js
          node --check admin/kunde-v2.js
          node --check admin/hjem.js
          node --check admin/home-project-link.js
          node --check admin/work-order-time.js
          node --check admin/lager-runtime.js
          node --check admin/inventory-project.js
          node --check admin/inventory-material-edit.js
          node --check admin/broyting.js
      - name: Kjør frontendtester
        run: node --test tests/*.test.js
