name: Public snow price consistency
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-snow-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public prices and API catalogue fallback
        run: node --test tests/public-snow-prices.test.cjs
      - name: Verify JavaScript syntax
        run: node --check site-consistency.js
