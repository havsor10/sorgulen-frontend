name: Staging build and link regression
on:
  pull_request:
    branches:
      - staging/sorgulen-test
  push:
    branches:
      - staging/sorgulen-test
jobs:
  staging-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated staging site and verify service links
        run: node tools/build-staging.cjs
