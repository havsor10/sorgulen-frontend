<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Forespørsler | Sørgulen Industriservice</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-pages.css">
</head>
<body>
  <div id="adminShell" data-page="requests"></div>
  <script src="admin-shell.js"></script>

  <main class="admin-main">
    <header class="admin-page-header">
      <div><p class="admin-eyebrow">Kundehenvendelser</p><h1>Forespørsler</h1><p>Vurder, besvar og følg opp prisforespørsler.</p></div>
      <div class="admin-page-actions"><button id="refreshBtn" class="admin-icon-button" type="button" aria-label="Oppdater forespørsler">↻</button></div>
    </header>

    <div class="navbar admin-filter-tabs" aria-label="Filtrer forespørsler">
      <button class="tab active" data-tab="all">Alle</button>
      <button class="tab" data-tab="new">Nye</button>
      <button class="tab" data-tab="reviewed">Vurdert</button>
      <button class="tab" data-tab="sent">Sendt</button>
      <button class="tab" data-tab="accepted">Aktiv</button>
      <button class="tab" data-tab="completed">Utført</button>
      <button class="tab" data-tab="invoiced">Fakturert</button>
      <button class="tab" data-tab="paid">Betalt</button>
      <button class="tab" data-tab="declined">Avslått</button>
      <button class="tab" data-tab="archived">Arkivert</button>
    </div>
    <div id="statusMessage" class="status-message"></div>
    <div class="req-wrap" id="reqList"></div>
  </main>

  <script src="foresporsler.js" defer></script>
  <script src="../config.js"></script>
</body>
</html>
