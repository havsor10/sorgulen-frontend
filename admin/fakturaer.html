<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Fakturaer | Sørgulen Industriservice</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-pages.css">
</head>
<body>
  <div id="adminShell" data-page="invoices"></div>
  <script src="admin-shell.js"></script>

  <main class="admin-main inv-wrap">
    <header class="admin-page-header">
      <div><p class="admin-eyebrow">Oppfølging</p><h1>Fakturaer</h1><p>Utkast, sending, forfall og betaling.</p></div>
      <div class="admin-page-actions"><button class="primary-btn" id="newInvoiceBtn" type="button">Ny faktura</button><button id="refreshBtn" class="admin-icon-button" type="button" aria-label="Oppdater fakturaer">↻</button></div>
    </header>
    <div id="statusMessage" class="status-message"></div>

    <div class="inv-toolbar">
      <button class="btn-backfill" id="backfillBtn" type="button">Tildel ref.nr til gamle jobber</button>
    </div>

    <div class="inv-summary" id="invSummary"></div>

    <div id="invContent">
      <div class="inv-loading">Laster fakturaer…</div>
    </div>
  </main>

  <script src="../config.js"></script>
  <script src="fakturaer.js"></script>
</body>
</html>
