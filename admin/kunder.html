<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunder | Sørgulen Industriservice</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-shell.css"></head>
<body><header><h1>Kunder</h1><a href="login.html" id="logoutBtn" class="logout">Logg ut</a><nav class="admin-section-links"><a href="hjem.html">Hjem</a><a href="oppdrag.html">Oppdrag</a><a href="admin-dashboard.html">Bookinger</a><a href="foresporsler.html">Forespørsler</a><a href="fakturaer.html">Fakturaer</a><a class="active" href="kunder.html">Kunder</a></nav></header>
