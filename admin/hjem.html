<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hjem – Sørgulen admin</title>
  <link rel="stylesheet" href="admin.css?v=20260904-clickfix2">
  <link rel="stylesheet" href="hjem.css?v=20260904-clickfix2">
  <link rel="stylesheet" href="admin-shell.css?v=20260904-clickfix2">
  <link rel="stylesheet" href="home-project-link.css?v=20260906-projectopen1">
</head>
<body class="home-body">
  <div id="adminShell" data-page="home"></div>
  <script src="admin-shell.js?v=20260904-clickfix2"></script>

  <main class="admin-main admin-main--narrow home-main">
    <header class="admin-page-header">
      <div><p class="admin-eyebrow">Oversikt</p><h1>God arbeidsdag</h1><p>Det viktigste akkurat nå.</p></div>
    </header>
    <div id="homeStatus" class="home-status" role="status" aria-live="polite">Henter dagens oversikt…</div>

    <section id="focusSection" class="focus-section" aria-labelledby="focusTitle">
      <div id="focusContent" class="home-card focus-card loading-card">Henter aktivt eller neste oppdrag…</div>
    </section>

    <section aria-labelledby="tasksTitle">
      <div class="section-title-row"><div><p class="eyebrow">Prioritert</p><h2 id="tasksTitle">Må gjøres</h2></div><button id="refreshBtn" class="icon-action" type="button" aria-label="Oppdater">↻</button></div>
      <div id="aiSummary" class="ai-summary hidden"></div>
      <div id="taskList" class="task-list loading-card">Kontrollerer hva som krever handling…</div>
    </section>

    <section id="ongoingSection" class="hidden" aria-labelledby="ongoingTitle">
      <div class="section-title-row"><div><p class="eyebrow">Prosjekter</p><h2 id="ongoingTitle">Pågående prosjekter</h2></div><a href="oppdrag.html" class="quiet-link">Se alle</a></div>
      <div id="ongoingProjects" class="booking-list"></div>
    </section>

    <section aria-labelledby="latestTitle">
      <div class="section-title-row"><div><p class="eyebrow">Nylig</p><h2 id="latestTitle">Siste bookinger</h2></div><a href="admin-dashboard.html" class="quiet-link">Se alle</a></div>
      <div id="latestBookings" class="booking-list loading-card">Henter bookinger…</div>
    </section>
  </main>

  <div id="quickModal" class="home-modal hidden" role="dialog" aria-modal="true" aria-labelledby="quickTitle">
    <form id="quickForm" class="home-sheet">
      <div class="sheet-head"><h2 id="quickTitle">Registrer</h2><button id="closeQuick" type="button" class="icon-action" aria-label="Lukk">×</button></div>
      <input id="quickOperationId" name="operationId" type="hidden">
      <div id="quickFields"></div>
      <p id="quickError" class="form-error" role="alert"></p>
      <button id="quickSave" type="submit" class="primary-action">Lagre</button>
    </form>
  </div>

  <div id="confirmModal" class="home-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="home-sheet small-sheet"><h2 id="confirmTitle">Bekreft</h2><p id="confirmText"></p><div class="confirm-actions"><button id="confirmCancel" type="button" class="secondary-action">Avbryt</button><button id="confirmOk" type="button" class="primary-action">Bekreft</button></div></div>
  </div>

  <script src="../config.js?v=20260904-clickfix2"></script>
  <script src="work-order-time.js?v=20260904-clickfix2"></script>
  <script src="hjem.js?v=20260904-clickfix2"></script>
  <script src="home-project-link.js?v=20260906-projectopen1"></script>
</body>
</html>
