<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Faktura | Sørgulen Industriservice</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-pages.css?v=20260919-discount1">
</head>
<body>
  <div id="adminShell" data-page="invoices"></div>
  <script src="admin-shell.js"></script>
  <main class="admin-main admin-main--narrow fd-wrap">
    <header class="admin-page-header"><div><p class="admin-eyebrow">Fakturadetalj</p><h1>Faktura</h1><p><a class="quiet-link" href="fakturaer.html">← Tilbake til fakturaer</a></p></div></header>
    <div id="statusMessage" class="status-message"></div>
    <div id="fdContent"><div class="fd-loading">Laster faktura…</div></div>
  </main>

  <dialog id="paymentDialog" class="fd-payment-dialog">
    <form id="paymentForm" class="fd-payment-form">
      <div>
        <p class="admin-eyebrow">Registrer innbetaling</p>
        <h2>Betaling mottatt</h2>
        <p id="paymentHelp">Registrer dato og beløp slik det faktisk kom inn på konto.</p>
      </div>
      <label>
        <span>Betalingsdato</span>
        <input id="paymentDate" type="date" required>
      </label>
      <label>
        <span>Beløp</span>
        <div class="fd-money-input"><input id="paymentAmount" type="number" min="0.01" step="0.01" required><span>kr</span></div>
      </label>
      <div class="fd-payment-actions">
        <button id="paymentCancel" class="btn-edit" type="button">Avbryt</button>
        <button class="btn-paid" type="submit">Registrer betaling</button>
      </div>
    </form>
  </dialog>
  <script src="../config.js"></script>
  <script src="faktura-detalj.js?v=20260919-discount1"></script>
</body>
</html>
