<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rediger faktura | Sørgulen Industriservice</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-pages.css">
</head>
<body>
  <div id="adminShell" data-page="invoices"></div>
  <script src="admin-shell.js"></script>
  <main class="admin-main admin-main--narrow nf-wrap">
    <header class="admin-page-header"><div><p class="admin-eyebrow">Fakturautkast</p><h1>Rediger faktura</h1><p><a class="quiet-link" href="fakturaer.html">← Tilbake til fakturaer</a></p></div></header>
    <div id="statusMessage" class="status-message"></div>
    <section class="nf-card">
      <h3>Kunde</h3>
      <div class="nf-row"><div class="nf-field"><label for="custName">Navn *</label><input type="text" id="custName" required></div><div class="nf-field"><label for="custPhone">Telefon</label><input type="text" id="custPhone"></div></div>
      <div class="nf-row"><div class="nf-field"><label for="custEmail">E-post</label><input type="email" id="custEmail"></div></div>
      <div class="nf-field"><label for="custAddress">Adresse</label><input type="text" id="custAddress" placeholder="Gate, postnr, sted"></div>
    </section>
    <section class="nf-card">
      <h3>Hva skal faktureres</h3>
      <p class="hint">Beskrivelse, tidsbruk/antall og sats. Summen regnes automatisk.</p>
      <div class="nf-field nf-spaced"><label for="dueDate">Forfallsdato</label><input id="dueDate" type="date"></div>
      <div class="nf-field nf-spaced"><label for="invoiceDescription">Overordnet beskrivelse</label><textarea id="invoiceDescription" rows="3"></textarea></div>
      <table class="lines-table"><thead><tr><th>Beskrivelse</th><th>Tid/antall</th><th>Enhet</th><th>Sats</th><th>Sum</th><th></th></tr></thead><tbody id="linesBody"></tbody></table>
      <div class="rate-toolbar"><button class="btn-add-line" id="addLineBtn" type="button">+ Manuell linje</button><button class="btn-add-line" id="aiLinesBtn" type="button">AI-forslag til beskrivelser</button></div>
      <div class="nf-total" id="totalDisplay">Total: 0 kr</div>
    </section>
    <div class="nf-actions"><button class="btn-save" id="saveBtn" type="button">Lagre som utkast</button><button class="btn-cancel" id="cancelBtn" type="button">Avbryt</button></div>
  </main>
  <script src="../config.js"></script>
  <script src="faktura-rediger.js"></script>
</body>
</html>
